<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="santaAnaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Texto principal -->
  <text x="100" y="25" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#santaAnaGradient)" 
        filter="url(#neon)"
        class="neon-text">
    PRÉSTAMOS
  </text>
  
  <text x="100" y="45" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#santaAnaGradient)" 
        filter="url(#neon)"
        class="neon-text">
    SANTA ANA
  </text>
  
  <!-- Decoración -->
  <circle cx="20" cy="30" r="3" fill="#ffffff" opacity="0.8" class="pulse"/>
  <circle cx="180" cy="30" r="3" fill="#dc2626" opacity="0.8" class="pulse"/>
  
  <style>
    .neon-text {
      text-shadow: 
        0 0 5px currentColor,
        0 0 10px currentColor,
        0 0 15px currentColor,
        0 0 20px #dc2626,
        0 0 35px #dc2626,
        0 0 40px #ffffff;
      animation: flicker 2s infinite alternate;
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
        text-shadow: 
          0 0 5px currentColor,
          0 0 10px currentColor,
          0 0 15px currentColor,
          0 0 20px #dc2626,
          0 0 35px #dc2626,
          0 0 40px #ffffff;
      }
      20%, 24%, 55% {
        opacity: 0.8;
        text-shadow: none;
      }
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.7;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</svg>